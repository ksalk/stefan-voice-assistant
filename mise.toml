# https://mise.jdx.dev

min_version = "2026.9.15"

# Mark secrets redacted (masked in task output); keep it before any table header
# so it stays a top-level mise option.
redactions = ["ConnectionStrings__StefanDb", "POSTGRES_PASSWORD"]

[tools]
dotnet = "10.0.101" # matches src/node/global.json (rollForward: latestMajor)
node = "22" # matches .github/workflows/ci.yml
pnpm = "10"

# Note: docker compose reads .env itself; keep .env out of the mise env so
# stray vars (e.g. VERSION) do not leak into MSBuild/NuGet.

# Image versioning
# Image tags default to the version Nerdbank.GitVersioning computes from
# version.json + git history (see .config/dotnet-tools.json for the nbgv tool);
# pass an explicit tag to override. Deploy compose files consume it via VERSION.
[tasks.get-version]
description = "Print the image version computed by Nerdbank.GitVersioning"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dotnet tool restore >/dev/null
dotnet nbgv get-version -v SimpleVersion
'''

# Database
[tasks.db-up]
description = "Start the database containers"
run = "docker compose --profile db up -d"

[tasks.migrations-add]
description = "Add an EF Core migration to StefanDbContext"
usage = 'arg "<name>" help="Migration name"'
run = "dotnet ef migrations add ${usage_name?} --project src/server/Stefan.Server.Infrastructure --context StefanDbContext"

[tasks.migrations-apply]
description = "Apply pending EF Core migrations (mise run -E dev|prod migrations-apply)"
run = [
  'test -n "$ConnectionStrings__StefanDb" || { echo "ConnectionStrings__StefanDb is not set - run with -E dev / -E prod (values live in gitignored mise.dev.local.toml / mise.prod.local.toml)" >&2; false; }',
  'echo "Applying migrations to $MISE_ENV environment (connection string redacted)"',
  'dotnet ef database update --connection "$ConnectionStrings__StefanDb" --project src/server/Stefan.Server.Infrastructure --context StefanDbContext'
]

# Server
[tasks.build-server]
description = "Build the server API"
run = "dotnet build src/server/Stefan.Server.API"

[tasks.run-server]
description = "Run the server API locally"
run = "dotnet run --project src/server/Stefan.Server.API"

[tasks.tts-generate]
description = "Synthesize a speech file from text (Stefan.Server.TtsGenerator)"
usage = '''
arg "<text>" help="Text to synthesize (quote if it contains spaces)"
flag "-o --output <file>" help="Output audio file path" required=#true
'''
dir = "src/server/Stefan.Server.TtsGenerator"
run = '''
#!/usr/bin/env bash
dotnet run --project . -- "${usage_text:?}" -o "${usage_output:?}"
'''

[tasks.build-server-image]
description = "Build the server Docker image"
run = "docker buildx build --platform linux/amd64 -t stefan-server -f src/server/Dockerfile . --load"

[tasks.publish-server]
description = "Build and push the server image"
usage = 'arg "<version>" help="Image version tag (default: computed by nbgv)" default=""'
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="${usage_version:-$(mise run get-version)}"
echo "Publishing stefan-server:$version"
docker buildx build --platform linux/amd64 --pull -t git.harnas.top/ksalk/stefan-server:"$version" -t git.harnas.top/ksalk/stefan-server:latest -f src/server/Dockerfile . --push
'''

[tasks.build-server-test-image]
description = "Build the server test image"
run = "docker buildx build --platform linux/amd64 -t stefan-server:test -f src/server/Dockerfile . --load"

[tasks.build-server-db-test-image]
description = "Build the server database test image"
run = "docker buildx build --platform linux/amd64 -t stefan-db:test -f src/server/Stefan.Db.Dockerfile . --load"

[tasks.build-server-test-images]
description = "Build all server test images"
depends = ["build-server-test-image", "build-server-db-test-image"]

# Node
[tasks.build-node-image]
description = "Build the node Docker image"
run = "docker buildx build --platform linux/arm64 -t stefan-node -f src/node/Dockerfile . --load"

[tasks.publish-node]
description = "Build and push the node image"
usage = 'arg "<version>" help="Image version tag (default: computed by nbgv)" default=""'
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="${usage_version:-$(mise run get-version)}"
echo "Publishing stefan-node:$version"
docker buildx build --platform linux/arm64 --pull -t git.harnas.top/ksalk/stefan-node:"$version" -t git.harnas.top/ksalk/stefan-node:latest -f src/node/Dockerfile . --push
'''

[tasks.build-node]
description = "Build the node"
run = "dotnet build src/node/Stefan.Node"

[tasks.run-node]
description = "Run the node locally"
run = "dotnet run --project src/node/Stefan.Node"

[tasks.run-node-test]
description = "Run the node with a test audio file"
run = "dotnet run --project src/node/Stefan.Node --send-file tests/node/Stefan.Node.IntegrationTests/TestAudioFiles/how-much-longer.wav"

[tasks.run-node-play-test]
description = "Run the node playing a local audio file"
usage = 'arg "<filepath>" help="Path to the audio file"'
run = "dotnet run --project src/node/Stefan.Node --play-file ${usage_filepath?}"

[tasks.build-node-test-image]
description = "Build the node test image"
run = "docker build --build-arg TARGET_ARCH=linux-x64 -t stefan-node:test -f src/node/Dockerfile . --load"

# Wake word
[tasks.wake-word-benchmark]
description = "Run the wake-word replay benchmark against a corpus manifest"
usage = '''
arg "<manifest>" help="Path to the corpus manifest" default="recordings/manifest.json"
flag "-o --output <dir>" help="Base directory for runs; each run writes a timestamped subdirectory with summary.csv / results.csv / results.jsonl / report.md / configuration.json" default="recordings/results"
flag "--model-path <dir>" help="Directory that contains the ONNX model files" default="models/onnx"
flag "--scores <values>" help="Comma-separated KeywordsScore values"
flag "--thresholds <values>" help="Comma-separated KeywordsThreshold values"
flag "--keywords-file <files>" help="Comma-separated keywords files to compare"
flag "--chunk-bytes <bytes>" help="PCM chunk size in bytes (~128 ms at the default 16 kHz mono)" default="4096"
flag "--tail-ms <ms>" help="Silence appended after each clip so trailing audio flushes" default="600"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=(--manifest "${usage_manifest:?}" --model-path "${usage_model_path:?}" --output-dir "${usage_output:?}"
  --chunk-bytes "${usage_chunk_bytes:?}" --tail-ms "${usage_tail_ms:?}")

if [[ -n "${usage_scores:-}" ]]; then args+=(--scores "${usage_scores}"); fi
if [[ -n "${usage_thresholds:-}" ]]; then args+=(--thresholds "${usage_thresholds}"); fi
if [[ -n "${usage_keywords_file:-}" ]]; then args+=(--keywords-file "${usage_keywords_file}"); fi

dotnet run --project src/node/Stefan.Node.WakeWordBenchmark -- "${args[@]}"
'''

# Dashboard
[tasks.run-ui]
description = "Run the dashboard dev server"
# Do not export an empty VITE_API_URL here. Vite gives process.env priority
# over .env files, so an empty value would shadow src/dashboard/stefan-ui/.env.
# Vite falls back to that .env file, and the mise env (mise -E dev) wins if set.
run = 'pnpm --prefix src/dashboard/stefan-ui run dev'

[tasks.build-dashboard-image]
description = "Build the dashboard Docker image"
# The Docker build context excludes .env, so the build arg is the only source
# for VITE_API_URL. Default to the same URL docker-compose.server.yml uses.
run = 'docker buildx build --build-arg VITE_API_URL="${VITE_API_URL:-http://localhost:5285}" --platform linux/amd64 -t stefan-dashboard -f src/dashboard/stefan-ui/Dockerfile src/dashboard/stefan-ui --load'

[tasks.publish-dashboard]
description = "Build and push the dashboard image"
usage = 'arg "<version>" help="Image version tag (default: computed by nbgv)" default=""'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The URL is baked into the image at build time. Publishing without it would
# ship a dashboard that calls the browser's own localhost, so fail fast.
test -n "${VITE_API_URL:-}" || { echo "VITE_API_URL is not set - run with -E prod (values live in gitignored mise.prod.toml)" >&2; false; }
version="${usage_version:-$(mise run get-version)}"
echo "Publishing stefan-dashboard:$version with VITE_API_URL=$VITE_API_URL"
docker buildx build --platform linux/amd64 --pull --build-arg VITE_API_URL="$VITE_API_URL" -t git.harnas.top/ksalk/stefan-dashboard:"$version" -t git.harnas.top/ksalk/stefan-dashboard:latest -f src/dashboard/stefan-ui/Dockerfile src/dashboard/stefan-ui --push
'''

# Tests
[tasks.test-server]
description = "Run server tests"
run = [
  "dotnet test tests/server/Stefan.Server.Domain.UnitTests",
  "dotnet test tests/server/Stefan.Server.DI.UnitTests",
  "dotnet test tests/server/Stefan.Server.IntegrationTests",
]

[tasks.test-node]
description = "Run node tests"
run = [
  "dotnet test tests/node/Stefan.Node.UnitTests",
  "dotnet test tests/node/Stefan.Node.IntegrationTests",
]

[tasks.test-ui]
description = "Run dashboard tests"
run = "pnpm --prefix src/dashboard/stefan-ui test"

[tasks.test]
description = "Run all tests"
run = [
  { task = "test-server" },
  { task = "test-node" },
  { task = "test-ui" },
]
